<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Sư AI - Đăng ký</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">Gia Sư AI</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Cột bên trái: Banner thông tin -->
    <section class="left-content">
      <span class="badge">Gia sư gợi mở</span>
      <h1>Học theo cách<br>bạn hiểu.</h1>
      <p class="description">
        Hỏi từng bước. Tự tìm lời giải. Nhìn thấy sự tiến bộ sau mỗi bài học.
      </p>
      <button class="btn-explore">Khám phá giao diện</button>
    </section>

    <!-- Cột bên phải: Form đăng ký -->
    <section class="card">
      
      <!-- Chuyển đổi Đăng nhập / Đăng ký -->
      <div class="tabs">
        <a href="../login/login.html" class="tab">Đăng nhập</a>
        <a href="index.html" class="tab active">Đăng ký</a>
      </div>

      <h2 class="form-title">Tạo tài khoản</h2>

      <form class="register-form">
        <div class="form-group">
          <label for="fullname">Họ tên</label>
          <input type="text" id="fullname" placeholder="">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="">
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input type="password" id="password" placeholder="">
          <small class="hint">
            Sử dụng ít nhất 8 ký tự. Nên chọn mật khẩu dài, khó đoán và không dùng lại ở tài khoản khác.
          </small>
        </div>

        <div class="form-group">
          <label for="confirm-password">Nhập lại mật khẩu</label>
          <input type="password" id="confirm-password" placeholder="">
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms">
          <label for="terms">Tôi đồng ý với quy định sử dụng cho người học từ đủ 18 tuổi.</label>
        </div>

        <button type="submit" class="btn-submit">Tạo tài khoản</button>
      </form>

    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <span>Gia Sư AI</span>
    <span>Học từng bước, hiểu sâu hơn.</span>
  </footer>

</body>
</html>
