<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gia Sư AI - Đăng nhập</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">Gia Sư AI</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Cột bên trái: Banner thông tin -->
    <section class="left-content">
      <h1>Tiếp tục hành<br>trình học của bạn.</h1>
      <p class="description">
        Đăng nhập để tiếp tục hội thoại với gia sư AI, luyện tập và theo dõi tiến độ học tập.
      </p>
      <button class="btn-explore">Tìm hiểu thêm &rsaquo;</button>
    </section>

    <!-- Cột bên phải: Form đăng nhập -->
    <section class="card">
      
      <!-- Chuyển đổi Đăng nhập / Đăng ký -->
      <div class="tabs">
        <a href="login.html" class="tab active">Đăng nhập</a>
        <a href="../register/index.html" class="tab">Đăng ký</a>
      </div>

      <h2 class="form-title">Chào mừng trở lại</h2>
      <p class="form-subtitle">Nhập email và mật khẩu của bạn.</p>

      <form class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="ban@example.com">
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-password-wrapper">
            <input type="password" id="password">
            <button type="button" class="btn-toggle-password">Hiện</button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Đăng nhập</button>
      </form>

      <div class="form-footer-link">
        <span>Chưa có tài khoản? </span>
        <a href="index.html">Đăng ký ngay</a>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <span>Gia Sư AI</span>
    <span>Học từng bước, hiểu sâu hơn.</span>
  </footer>

</body>
</html>
